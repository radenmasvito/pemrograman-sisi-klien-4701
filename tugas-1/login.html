<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f2f4f7] min-h-screen flex items-center justify-center font-sans">

    <!-- Card Login -->
    <div class="bg-white p-8 rounded-2xl shadow-sm w-full max-w-md border border-gray-100">
        <h1 class="text-3xl font-bold text-center text-[#2563eb] mb-8">Login</h1>

        <form class="space-y-5">
            <!-- Input Email -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email</label>
                <input type="email" placeholder="Masukkan email" 
                    class="w-full px-3.5 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 text-gray-700 placeholder-gray-400">
            </div>

            <!-- Input Password -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
                <input type="password" placeholder="Masukkan password" 
                    class="w-full px-3.5 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 text-gray-700 placeholder-gray-400">
            </div>

            <!-- Checkbox & Lupa Password -->
            <div class="flex items-center justify-between text-sm pt-1">
                <label class="flex items-center gap-2 text-gray-700 cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-blue-600 accent-blue-600 focus:ring-blue-500">
                    <span>Ingat saya</span>
                </label>
                <a href="#" class="text-[#2563eb] hover:underline">Lupa password?</a>
            </div>

            <!-- Tombol Submit -->
            <button type="submit" 
                class="w-full py-3 bg-[#2563eb] text-white font-medium rounded-lg hover:bg-blue-700 transition duration-200">
                Login
            </button>
        </form>

        <!-- Footer Link -->
        <div class="text-center text-sm text-gray-600 mt-6">
            Belum punya akun? <a href="#" class="text-[#2563eb] hover:underline font-medium">Daftar</a>
        </div>
    </div>

</body>
</html>
