<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f0f2f5] font-sans min-h-screen flex text-gray-800">

    <!-- Sidebar -->
    <aside class="w-64 bg-[#0a1b3a] text-white flex flex-col shrink-0">
        <div class="p-6">
            <h1 class="text-xl font-bold tracking-wide">Admin</h1>
        </div>
        <nav class="flex-1 px-3 space-y-1">
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-[#12284c] rounded-lg text-sm font-medium transition">
                <span>🏠</span>
                <span>Dashboard</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-[#112a53] text-white rounded-lg text-sm font-medium">
                <span>🎓</span>
                <span>Mahasiswa</span>
            </a>
        </nav>
    </aside>

    <!-- Content Container -->
    <div class="flex-1 flex flex-col min-h-screen relative">

        <!-- Header -->
        <header class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between">
            <h2 class="text-2xl font-bold text-gray-900">Mahasiswa</h2>
            <div class="w-10 h-10 rounded-full bg-slate-300 flex items-center justify-center cursor-pointer">
                <!-- User Avatar Circle -->
            </div>
        </header>

        <!-- Main Content -->
        <main class="p-8 flex-1">
            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                <!-- Header Card & Button -->
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-lg font-bold text-gray-900">Daftar Mahasiswa</h3>
                    <button class="bg-[#1034a6] hover:bg-blue-900 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-1 transition">
                        + Tambah Mahasiswa
                    </button>
                </div>

                <!-- Table -->
                <div class="overflow-x-auto rounded-lg border border-gray-200">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-[#0c3875] text-white">
                                <th class="p-3.5 font-bold w-1/4">NIM</th>
                                <th class="p-3.5 font-bold w-2/4">Nama</th>
                                <th class="p-3.5 font-bold w-1/4 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200 text-gray-700">
                            <tr>
                                <td class="p-3.5 font-medium">20211002</td>
                                <td class="p-3.5"></td>
                                <td class="p-3.5 flex justify-center gap-2">
                                    <button class="bg-[#8b631b] hover:bg-amber-800 text-white px-3 py-1 rounded text-xs font-medium">Edit</button>
                                    <button class="bg-[#9c1c24] hover:bg-red-800 text-white px-3 py-1 rounded text-xs font-medium">Hapus</button>
                                </td>
                            </tr>
                            <tr>
                                <td class="p-3.5 font-medium">20211003</td>
                                <td class="p-3.5"></td>
                                <td class="p-3.5 flex justify-center gap-2">
                                    <button class="bg-[#8b631b] hover:bg-amber-800 text-white px-3 py-1 rounded text-xs font-medium">Edit</button>
                                    <button class="bg-[#9c1c24] hover:bg-red-800 text-white px-3 py-1 rounded text-xs font-medium">Hapus</button>
                                </td>
                            </tr>
                            <tr>
                                <td class="p-3.5 font-medium">20211004</td>
                                <td class="p-3.5"></td>
                                <td class="p-3.5 flex justify-center gap-2">
                                    <button class="bg-[#8b631b] hover:bg-amber-800 text-white px-3 py-1 rounded text-xs font-medium">Edit</button>
                                    <button class="bg-[#9c1c24] hover:bg-red-800 text-white px-3 py-1 rounded text-xs font-medium">Hapus</button>
                                </td>
                            </tr>
                            <tr>
                                <td class="p-3.5 font-medium">20211005</td>
                                <td class="p-3.5"></td>
                                <td class="p-3.5 flex justify-center gap-2">
                                    <button class="bg-[#8b631b] hover:bg-amber-800 text-white px-3 py-1 rounded text-xs font-medium">Edit</button>
                                    <button class="bg-[#9c1c24] hover:bg-red-800 text-white px-3 py-1 rounded text-xs font-medium">Hapus</button>
                                </td>
                            </tr>
                            <tr>
                                <td class="p-3.5 font-medium">20211001</td>
                                <td class="p-3.5"></td>
                                <td class="p-3.5 flex justify-center gap-2">
                                    <button class="bg-[#8b631b] hover:bg-amber-800 text-white px-3 py-1 rounded text-xs font-medium">Edit</button>
                                    <button class="bg-[#9c1c24] hover:bg-red-800 text-white px-3 py-1 rounded text-xs font-medium">Hapus</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="text-center py-4 text-xs text-gray-500">
            © 2025 Admin Dashboard. All rights reserved.
        </footer>

        <!-- Modal Overlay (Sesuai Tampilan Gambar 2) -->
        <div class="fixed inset-0 bg-black/50 backdrop-blur-[1px] flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
                
                <!-- Modal Header -->
                <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
                    <h3 class="font-bold text-gray-900 text-base">Tambah Mahasiswa</h3>
                    <button class="text-gray-400 hover:text-gray-600 text-lg font-bold leading-none">&times;</button>
                </div>

                <!-- Modal Body / Form -->
                <form class="p-6 space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-800 mb-1.5">NIM</label>
                        <input type="text" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-800 mb-1.5">Nama</label>
                        <input type="text" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:border-blue-500">
                    </div>

                    <!-- Modal Actions/Buttons -->
                    <div class="flex justify-end gap-2.5 pt-4">
                        <button type="button" 
                            class="px-5 py-2 bg-[#94a3b8] hover:bg-slate-500 text-white rounded-lg text-sm font-medium transition">
                            Batal
                        </button>
                        <button type="submit" 
                            class="px-5 py-2 bg-[#2563eb] hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition">
                            Simpan
                        </button>
                    </div>
                </form>

            </div>
        </div>

    </div>

</body>
</html>
